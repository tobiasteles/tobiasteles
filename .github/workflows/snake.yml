name: Generate Snake

on:
  # atualiza todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda também a cada push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF9A3C&color_dots=#ebedf0,#ffe0b8,#ffc27a,#ff9a3c,#c2590f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF9A3C&color_dots=#161b22,#4a2a0c,#8a4510,#d9741a,#FF9A3C

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
